[package]
name = "dusimagez-wasm"
version = "0.1.0"
edition = "2024"
# license-file (not license) so wasm-pack finds the repo-root
# LICENSE instead of warning that no LICENSE file exists.
license-file = "../../LICENSE"
repository = "https://github.com/dusmamud/dusimagez"
authors = ["dusmamud"]
description = "WASM bindings for dusimagez — thin wrappers over the Rust core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dusimagez = { path = "../dusimagez" }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"

# wasm-opt (binaryen) cannot be downloaded in offline/sandboxed builds;
# disabling it keeps `wasm-pack build` working without optimisation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
