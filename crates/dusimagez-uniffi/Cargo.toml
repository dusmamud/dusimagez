[package]
name = "dusimagez-uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "UniFFI scaffolding for dusimagez — the cdylib Kotlin (Android) and Swift (iOS) bind against. No logic here; every call delegates to the dusimagez core."
publish = false

[lib]
name = "uniffi_dusimagez"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dusimagez = { path = "../dusimagez" }
# `cli` enables `uniffi::uniffi_bindgen_main()` for the
# `src/bin/uniffi-bindgen.rs` binary — the `uniffi_bindgen` crate
# ships no binary of its own in 0.29, and there is no matching
# `uniffi-bindgen` binary crate on crates.io, so never `cargo install
# uniffi-bindgen` for this crate.
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
