[package]
name = "dusimagez-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dusmamud/dusimagez"
homepage = "https://github.com/dusmamud/dusimagez"
authors = ["dusmamud"]
description = "Python bindings for dusimagez — thin PyO3 wrappers over the Rust core"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
dusimagez = { path = "../dusimagez" }
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
serde_json = "1"
