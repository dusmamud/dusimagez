name: Python

on:
  push:
    branches: [main]
    paths:
      - "crates/dusimagez-py/**"
      - "packages/python/**"
      - "shared/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/dusimagez-py/**"
      - "packages/python/**"
      - "shared/**"
      - ".github/workflows/python.yml"

jobs:
  python:
    name: maturin wheel + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/dusimagez-py/Cargo.toml --out dist
      - name: Install the wheel FIRST (pytest runs against the installed package)
        run: |
          pip install dist/*.whl
          pip install -e packages/python[dev]
      - name: Pytest (Python wrapper suite)
        working-directory: packages/python
        run: pytest
      - name: Pytest (native PyO3 crate suite)
        # crates/dusimagez-py/tests (45 tests: ops, errors, models,
        # pydantic, shared vectors) is a separate suite from the
        # wrapper's own tests — it must run against the installed
        # wheel, which the step above installed first.
        run: python -m pytest crates/dusimagez-py/tests
