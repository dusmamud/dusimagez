name: Release PR
# Release flow (mirrors dusrelimage's green Release PR workflow):
#  - On every push to main, `release-plz update` bumps the Cargo workspace
#    version from conventional commits (feat -> minor, fix -> patch,
#    chore/docs -> no bump) and updates CHANGELOG.md, and the job opens
#    (or updates) a `release-plz` PR with all of it.
#  - Merging that PR does NOT publish by itself. Publish stays manual
#    (cargo publish / npm.yml / pypi.yml dispatches).
#  - NOTE: the first version of this file used release-plz/action with
#    `command: release-pr` — it failed with 403 opening the PR, so the
#    action is NOT used here. Install the CLI directly and run `update`
#    ourselves, exactly as dusrelimage does. Pinned to 0.4.3: 0.4.2 has
#    a changelog-template regression that breaks `release-plz update`.
#    If the `gh pr create` step below ever 403s on a real release, the
#    repo setting "Allow GitHub Actions to create and approve pull
#    requests" needs enabling (dashboard step, not code).
#  - NOTE: there is no scripts/sync-versions.sh yet (dusrelimage has
#    one); until it exists, JS/Python/website versions are NOT
#    auto-synced by this workflow — bump them in lockstep by hand.
#  - For the first publish (v0.1.0) the CHANGELOG already lists 0.1.0
#    as released, so release-plz finds "nothing to release" and this
#    job exits 0 — the first crates.io publish goes via manual
#    dispatch / cargo publish, exactly as with dusrelimage.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: release-plz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install release-plz
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: release-plz@0.4.3
      - name: Update versions and changelog
        run: release-plz update
      - name: Refresh Cargo.lock
        run: cargo check -p dusimagez
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing to release"
            exit 0
          fi
          version=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release-plz
          git add -A
          git commit -m "chore: Release package dusimagez version $version"
          git push --force-with-lease origin release-plz
          if gh pr list --head release-plz --json number --jq '.[0].number' | grep -q .; then
            echo "release PR already open, branch updated"
          else
            gh pr create --base main --head release-plz \
              --title "chore: Release package dusimagez version $version" \
              --body "Release PR (release-plz). After merging, publish dusimagez $version to crates.io manually; npm and PyPI still need their manual dispatches."
          fi
