name: Release

# release-plz: on every push to main it checks whether any crate changed
# since the last release; if so it opens/updates a release PR (version
# bump + CHANGELOG), and when that PR is merged it publishes to crates.io
# and creates a GitHub Release (see .release-plz.toml).
# NOTE: for the first publish (v0.1.0) the CHANGELOG already lists 0.1.0
# as released, so release-plz will find "nothing to release" — the first
# crates.io publish goes via a manual release dispatch / cargo publish,
# exactly as with dusrelimage. release-plz takes over from the first
# post-0.1.0 change onward.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
